name: ustabim-tools

# Workers intentionally have no runnable service until their applications and
# Dockerfiles exist. These extension blocks document their future configuration
# without making `docker compose up` depend on nonexistent artifacts.
x-document-worker:
  future-service: document-worker
  profile: workers
  expected-url-variable: DOCUMENT_WORKER_URL
  expected-secret-variable: DOCUMENT_WORKER_SECRET

x-ifc-worker:
  future-service: ifc-worker
  profile: workers
  expected-url-variable: IFC_WORKER_URL
  expected-secret-variable: IFC_WORKER_SECRET

services:
  n8n-db:
    image: postgres:16-alpine
    profiles: ["automation"]
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:-local-development-only}
    volumes:
      - n8n-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: ["automation"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    profiles: ["automation"]
    depends_on:
      n8n-db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-local-development-only}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-development-only}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  n8n-db-data:
  n8n-data:
  redis-data:
